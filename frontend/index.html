<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Management System</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-container">
      <div class="login-header">
        <div class="login-logo"><i class="fas fa-building"></i></div>
        <h1>Employee Management System</h1>
        <p>Sign in to your account</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label><i class="fas fa-user"></i> Username</label>
          <input type="text" id="loginUsername" placeholder="e.g., priya.patel" required />
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>
        <div id="loginError" class="error-msg" style="display:none;"></div>
        <div class="login-hint">
          <small>Demo: username <code>priya.patel</code> / password <code>Pass@123</code></small>
        </div>
      </form>
    </div>
  </div>

  <div id="mainApp" class="main-app" style="display:none;">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i class="fas fa-building"></i>
          <span>EMS</span>
        </div>
      </div>

      <div class="user-info">
        <div class="user-avatar" id="userAvatar">AS</div>
        <div class="user-details">
          <span class="user-name" id="userName">Amit Sharma</span>
          <span class="user-role" id="userRole">Manager</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard"><i class="fas fa-th-large"></i><span>Dashboard</span></a>
        <a href="#" class="nav-item" data-page="employees"><i class="fas fa-users"></i><span>Employees</span></a>
        <a href="#" class="nav-item" data-page="attendance"><i class="fas fa-clock"></i><span>Attendance</span></a>
        <a href="#" class="nav-item" data-page="payroll"><i class="fas fa-money-bill-wave"></i><span>Payroll</span></a>
        <a href="#" class="nav-item" data-page="performance"><i class="fas fa-chart-line"></i><span>Performance</span></a>
        <a href="#" class="nav-item" data-page="audit"><i class="fas fa-shield-alt"></i><span>Audit Log</span></a>
      </nav>

      <div class="sidebar-footer">
        <a href="#" id="logoutBtn" class="nav-item">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </a>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <div class="page-title"><h2 id="pageTitle">Dashboard</h2></div>
        <div class="top-bar-actions">
          <span class="current-date" id="currentDate"></span>
        </div>
      </header>

      <div class="content-area" id="contentArea"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <div id="modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Modal</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
